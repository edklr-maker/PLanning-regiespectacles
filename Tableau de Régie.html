function chart(a){const W=680,H=210,L=36,R=8,Tp=18,Bm=30,n=16,bw=(W-L-R)/n,rows=[];let mx=0;
 for(let k=0;k<n;k++){const mo=8+k,y=2026+Math.floor(mo/12),m=mo%12,nd=new Date(Date.UTC(y,m+1,0)).getUTCDate(),i0=idx(y,m,1);let re=0,pl=0;for(let d=0;d<nd;d++){const i=i0+d,t=cell(a,i).t;i<=TI?re+=t:pl+=t}rows.push([mo,re,pl]);mx=Math.max(mx,re+pl)}
 const top=Math.max(10,Math.ceil(mx/10)*10),y=v=>H-Bm-(v/top)*(H-Bm-Tp);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heures par mois de ${A[a]}">`;
 [0,top/2,top].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 rows.forEach(([mo,re,pl],k)=>{const x=L+k*bw+bw*.18,w=bw*.64,m=mo%12;s+=`<rect x="${x}" y="${y(re)}" width="${w}" height="${H-Bm-y(re)}" fill="var(--bar)"/><rect x="${x}" y="${y(re+pl)}" width="${w}" height="${y(re)-y(re+pl)}" fill="color-mix(in srgb,var(--accent) 45%,var(--panel))"/>`;
  if(re+pl)s+=`<text class="v" x="${x+w/2}" y="${y(re+pl)-4}" text-anchor="middle">${re+pl}</text>`;
  s+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle">${MON[m].slice(0,3)}</text>`;if(m===0||k===0)s+=`<text x="${x+w/2}" y="${H-1}" text-anchor="middle">${2026+Math.floor(mo/12)}</text>`});
 if(TI>=MIN&&TI<=MAX){const mo=monthOf(TI),k=mo-8,nd=new Date(Date.UTC(2026+Math.floor(mo/12),mo%12+1,0)).getUTCDate(),f=(dd(TI).getUTCDate()-.5)/nd,x=L+(k+f)*bw;s+=`<line x1="${x}" x2="${x}" y1="${Tp-6}" y2="${H-Bm}" stroke="var(--rc)" stroke-dasharray="3 3"/>`}
 return s+'</svg>'}

async function publishPage(){if(!EDIT)return false;try{const art=await claude.use('artifact');if(!art)return false;const b=document.body.cloneNode(true);['#view','#led','#fa','#ft','#res','#dr','#tabs','#nav','#upd'].forEach(k=>{const n=b.querySelector(k);if(n)n.innerHTML=''});const dr=b.querySelector('#dr');if(dr)dr.className='dr';const tt=b.querySelector('#toast');if(tt){tt.hidden=true;tt.textContent=''}
 D.upd=new Date().toLocaleDateString('fr-FR');b.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');const st=document.head.querySelector('style');
 await art.publish('<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+(st?st.textContent:'')+'</style></head><body>'+b.innerHTML+'</body></html>');return true}catch(e){return false}}
async function saveForm(){const f=S.form,er=$('#ferr'),l=f.l.trim();
 if(!l){er.textContent='Indiquez le nom de la mission.';$('#fl').focus();return}
 if(!(f.d>=MIN&&f.d<=MAX)){er.textContent='Choisissez une date entre septembre 2026 et décembre 2027.';return}
 if(!f.ag.size){er.textContent='Choisissez au moins un agent.';return}
 const ags=f.ag.size===A.length?'Équipe':[...f.ag].sort((a,b)=>a-b).map(a=>A[a]).join(', '),sl=[...f.sl].sort().map(k=>SLN[k]).join(', '),c=f.c.trim().slice(0,200),
  x=[l.slice(0,40),f.t,1,ags,new Date().toLocaleDateString('fr-FR'),sl,Date.now()];
 (D.ev[f.d]=D.ev[f.d]||[]).push(x);if(c)(D.cm[f.d]=D.cm[f.d]||[]).push([ags,c,x[0]]);keepImp(f.d,x,c);
 const d=f.d;S.form=null;go(d);toast('Mission ajoutée ✓');const ok=await publishPage();toast(ok?'Mission ajoutée et publiée pour l’équipe ✓':'Mission ajoutée sur cet appareil. Exportez-la pour l’Excel ou envoyez-la sur WhatsApp.')}
async function exportImp(){const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',r=['Date;Mission;Type;Agents;Créneaux;Commentaire;Saisie le'];
 Object.keys(D.ev).map(Number).sort((a,b)=>a-b).forEach(i=>D.ev[i].filter(x=>x[2]).forEach(x=>{const c=(D.cm[i]||[]).find(y=>y[2]===x[0]);r.push([fmt(i,{day:'2-digit',month:'2-digit',year:'numeric'}),x[0],T[x[1]][0],x[3],x[5]||'',c?c[1]:'',x[4]||''].map(q).join(';'))}));
 try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'missions_imprevues.csv',data:'﻿'+r.join('\n')});toast('Fichier prêt pour Excel')}catch(e){try{await navigator.clipboard.writeText(r.join('\n'));toast('Export bloqué ici : liste copiée, collez-la dans Excel')}catch(x){toast('Export indisponible dans cet affichage')}}}
$('#dr').addEventListener('input',e=>{const f=S.form,t=e.target;if(!f)return;const er=$('#ferr');if(er)er.textContent='';if(t.id==='fl')f.l=t.value;else if(t.id==='fc')f.c=t.value;else if(t.id==='ftype')f.t=+t.value;else if(t.id==='fd'){const p=t.value.split('-');if(p.length===3&&p[0].length===4)f.d=idx(+p[0],+p[1]-1,+p[2])}});
$('#upd').textContent='Planning au '+D.upd+' · '+A.length+' agents · septembre 2026 à décembre 2027';
loadImp();render();
</script>
